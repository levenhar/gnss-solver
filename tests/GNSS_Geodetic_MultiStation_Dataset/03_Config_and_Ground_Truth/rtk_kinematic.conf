# RTKLIB config for kinematic relative solution
# Base position hard-coded to 32°03'34.2"N 34°48'20.2"E

pos1-posmode       = kinematic
pos1-frequency     = l1+l2
pos1-elmask        = 15
pos1-snrmask_r     = off
pos1-snrmask_b     = off
pos1-dynamics      = on
pos1-ionoopt       = off
pos1-tropopt       = saas

pos2-armode        = fix-and-hold
pos2-gloarmode     = on
pos2-arthres       = 3.0
pos2-arlockcnt     = 0
pos2-minfixsats    = 5
pos2-minholdsats   = 5
pos2-aroutcnt      = 5

ant1-postype       = rinexhead   # rover: use RINEX header approx position
ant2-postype       = llh         # base: use fixed coordinates below
ant2-pos1          = 32.059500    # base latitude (degrees)
ant2-pos2          = 34.805611    # base longitude (degrees)  
ant2-pos3          = 50.0       # base height (meters)

out-solformat      = llh         # output lat/lon/height
out-outhead        = on
out-outopt         = on
out-timesys        = gpst
out-height         = ellipsoidal
out-timedir        = forward
