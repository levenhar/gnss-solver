server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Vite content-hashes filenames under /assets, so a given URL's content
    # never changes — safe to cache for a year (avoids stale index.html
    # pointing at a still-cached-but-deleted old bundle after a rebuild).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
