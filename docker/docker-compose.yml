services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - gnss-data:/data
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    volumes:
      - gnss-data:/data
    depends_on:
      - redis

  cleanup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m worker.cleanup
    environment:
      DATA_DIR: /data
    volumes:
      - gnss-data:/data

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  gnss-data:
