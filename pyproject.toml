[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["gnss_engine*", "api*", "worker*"]

[tool.setuptools.package-data]
"gnss_engine.conf" = ["*.conf"]

[tool.pytest.ini_options]
markers = ["requires_rtklib: needs rnx2rtkp/CRX2RNX on PATH"]
testpaths = ["tests"]
filterwarnings = [
    # Third-party: newer Starlette TestClient deprecates httpx in favour of httpx2.
    # Not our code and not actionable here; keep test output pristine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
